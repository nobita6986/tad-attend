name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: mbstring, dom, xml, xmlreader, xmlwriter, simplexml, gd, zip, zlib, iconv, fileinfo, openssl, pdo, pdo_mysql, pdo_sqlite, intl, bcmath

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: PHP syntax (php -l)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Lint every PHP file
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 > /tmp/lint.log || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }
          echo "OK: $(wc -l < /tmp/lint.log) files"

  tests:
    name: Feature tests (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Composer validate
        run: composer validate --no-check-publish
      - name: Composer install (generate lock if missing)
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --no-progress --prefer-dist
          else
            echo "::warning::composer.lock missing - resolving dependencies (commit the uploaded lock file)"
            composer update --no-interaction --no-progress --prefer-dist
          fi
      - name: Upload generated composer.lock
        if: always() && hashFiles('backend/composer.lock') != '' && matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: backend/composer.lock
          if-no-files-found: ignore
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Run tests
        run: php artisan test

  mysql:
    name: Migrations on MySQL 8.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: face_attendance
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: face_attendance
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: |
          if [ -f composer.lock ]; then composer install --no-interaction --no-progress --prefer-dist
          else composer update --no-interaction --no-progress --prefer-dist; fi
      - name: Migrate fresh, rollback, migrate again
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan route:list --except-vendor

  quality:
    name: Backend quality gate
    if: always()
    needs: [lint, tests, mysql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every backend job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          MYSQL: ${{ needs.mysql.result }}
        run: |
          test "$LINT" = "success"
          test "$TESTS" = "success"
          test "$MYSQL" = "success"

name: FaceAttendance
options:
  bundleIdPrefix: vn.tad
  deploymentTarget:
    iOS: '16.0'
packages:
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.19.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    PRODUCT_BUNDLE_IDENTIFIER: vn.tad.attend
    MARKETING_VERSION: '1.3.0'
    CURRENT_PROJECT_VERSION: '4'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_CFBundleDisplayName: 'TAD Attend'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait'
    INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
    INFOPLIST_KEY_NSCameraUsageDescription: 'Camera trước dùng đăng ký khuôn mặt và chấm công theo sự đồng ý của nhân viên.'
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'Vị trí GPS dùng xác thực trụ sở chi nhánh khi đăng ký thiết bị lần đầu và khi chấm công.'
    INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: 'NO'
    INFOPLIST_KEY_NSFaceIDUsageDescription: 'Ứng dụng KHÔNG sử dụng Face ID của hệ điều hành.'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    ENABLE_BITCODE: 'NO'
targets:
  FaceAttendance:
    type: application
    platform: iOS
    sources:
      - path: FaceAttendance/Sources
      - path: FaceAttendance/Resources
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
    settings:
      base:
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: 'arm64'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - FaceAttendanceTests
  FaceAttendanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FaceAttendanceTests
    dependencies:
      - target: FaceAttendance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tad.attend.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/FaceAttendance.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FaceAttendance'
        BUNDLE_LOADER: '$(TEST_HOST)'
